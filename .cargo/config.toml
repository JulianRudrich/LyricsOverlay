# Windows: the C and C++ runtime go into the app itself, so Singline starts on
# PCs without the Visual C++ Redistributable. whisper.cpp, the only C++ part,
# would otherwise need MSVCP140.dll.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

# whisper-rs passes CMAKE_* variables on to the build of whisper.cpp, which
# then uses the same static runtime in every configuration. The policy lets the
# runtime setting apply although whisper.cpp asks for an older CMake. Other
# systems ignore both.
[env]
CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
