# Windows: the C and C++ runtime go into the app itself, so Singline starts on
# PCs without the Visual C++ Redistributable. whisper.cpp, the only C++ part,
# would otherwise need MSVCP140.dll.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

# whisper-rs passes GGML_* and CMAKE_* variables on to the build of whisper.cpp.
[env]
# For every processor of the platform (AVX2 on x86-64), not only the one that
# builds it, so Sing to find runs on the computer Singline is installed on.
GGML_NATIVE = "OFF"
# The static Windows runtime in every configuration. The policy lets the
# setting apply although whisper.cpp asks for an older CMake. Other systems
# ignore both.
CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
