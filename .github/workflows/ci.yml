name: macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Run core checks
        run: swift run LyricsCoreChecks
      - name: Build app bundle
        run: bash build-app.sh
      - name: Build universal preview archive
        run: bash build-release.sh 0.1.0
      - name: Verify packaged app
        run: |
          mkdir -p "$RUNNER_TEMP/verify"
          ditto -x -k dist/Lyrics-Overlay-0.1.0-universal.zip "$RUNNER_TEMP/verify"
          APP="$RUNNER_TEMP/verify/Lyrics Overlay.app"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "0.1.0"
          codesign --verify --verbose=2 "$APP"
          lipo "$APP/Contents/MacOS/LyricsOverlay" -verify_arch arm64 x86_64
      - name: Upload preview archive
        uses: actions/upload-artifact@v4
        with:
          name: Lyrics-Overlay-0.1.0-universal
          path: dist/Lyrics-Overlay-0.1.0-universal.zip
          if-no-files-found: error
