<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title description">
  <title id="title">Lyrics Overlay</title>
  <desc id="description">An illustration of the Lyrics Overlay panel highlighting the current lyric above a desktop window.</desc>
  <defs>
    <clipPath id="bounds">
      <rect width="1200" height="540" rx="32"/>
    </clipPath>
    <linearGradient id="background" x2="1" y2=".72">
      <stop stop-color="#0B1117"/>
      <stop offset="1" stop-color="#101D25"/>
    </linearGradient>
    <radialGradient id="light" cx=".67" cy="1" r=".75">
      <stop stop-color="#245F62" stop-opacity=".68"/>
      <stop offset="1" stop-color="#142A34" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desktop" x2=".9" y2="1">
      <stop stop-color="#1E2E38"/>
      <stop offset="1" stop-color="#18272F"/>
    </linearGradient>
    <linearGradient id="panel" x2="1" y2="1">
      <stop stop-color="#17232C"/>
      <stop offset="1" stop-color="#0E151C"/>
    </linearGradient>
    <linearGradient id="panel-rim" x2=".84" y2="1">
      <stop stop-color="#799DA2" stop-opacity=".68"/>
      <stop offset="1" stop-color="#53696D" stop-opacity=".32"/>
    </linearGradient>
    <linearGradient id="trace" x2="1" y2="0">
      <stop stop-color="#79F2D4" stop-opacity="0"/>
      <stop offset=".3" stop-color="#79F2D4" stop-opacity=".29"/>
      <stop offset=".64" stop-color="#79F2D4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#79F2D4" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-.25" y="-.25" width="1.5" height="1.65" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#03080B" flood-opacity=".78"/>
    </filter>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1200" height="540" fill="url(#background)"/>
    <rect width="1200" height="540" fill="url(#light)"/>
    <path d="M-48 451H69l16-11 14 11 18 0 18-26 20 59 20-102 20 110 17-62 14 21h65l16-15 14 15h124l14-26 13 26h104l22-12 13 12h137l12-12 17 12h160l15-20 12 20h112"
      fill="none" stroke="url(#trace)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M72 493H1128" stroke="#B2C8CF" stroke-opacity=".1"/>

    <g transform="translate(72 94)">
      <rect width="56" height="56" rx="14" fill="#173038" stroke="#79F2D4" stroke-opacity=".3"/>
      <path d="M21 18h17M21 38h13" stroke="#BDCFD5" stroke-opacity=".55" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M21 28h23" stroke="#79F2D4" stroke-width="2.8" stroke-linecap="round"/>
      <path d="m12 25 5 3-5 3z" fill="#79F2D4"/>
    </g>
    <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
      <text x="66" y="234" fill="#F1F6F7" font-size="79" font-weight="700" letter-spacing="-5">Lyrics</text>
      <text x="66" y="316" fill="#F1F6F7" font-size="79" font-weight="700" letter-spacing="-5">Overlay</text>
      <text x="73" y="366" fill="#AFBEC6" font-size="24" font-weight="500" letter-spacing=".15">Synced lyrics for macOS</text>
    </g>

    <g>
      <rect x="464" y="88" width="605" height="329" rx="22" fill="url(#desktop)" stroke="#6F8B91" stroke-opacity=".35"/>
      <path d="M464 137h605" stroke="#7D9DA3" stroke-opacity=".22"/>
      <circle cx="487" cy="113" r="4" fill="#7F97A0" opacity=".48"/>
      <circle cx="503" cy="113" r="4" fill="#7F97A0" opacity=".37"/>
      <circle cx="519" cy="113" r="4" fill="#7F97A0" opacity=".29"/>
      <rect x="653" y="109" width="227" height="8" rx="4" fill="#819BA4" opacity=".14"/>
      <path d="M575 137v280" stroke="#819BA4" stroke-opacity=".18"/>
      <path d="M486 164h61m-61 21h47m-47 46h62m-62 21h56m-56 21h43m-43 21h62"
        fill="none" stroke="#879EA7" stroke-opacity=".26" stroke-width="4" stroke-linecap="round"/>
      <path d="M598 166h240m-240 16h164" fill="none" stroke="#879EA7" stroke-opacity=".18" stroke-width="4" stroke-linecap="round"/>
    </g>

    <rect x="558" y="196" width="571" height="241" rx="22" fill="#0E151C" filter="url(#shadow)"/>
    <rect x="558" y="196" width="571" height="241" rx="22" fill="url(#panel)" stroke="url(#panel-rim)" stroke-width="1.5"/>
    <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
      <rect x="585" y="220" width="40" height="40" rx="9" fill="#26413F"/>
      <path d="M594 240h4l3-6 4 12 4-15 4 9h3" stroke="#79F2D4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="637" y="235" fill="#F1F6F7" font-size="15" font-weight="650">Nachthimmel</text>
      <text x="637" y="253" fill="#AFBEC6" font-size="13">Lyrics Overlay · Demo</text>
      <path d="M1080 226h10l6 6v18h-16z M1090 226v6h6 M1084 239h8m-8 5h6" stroke="#79F2D4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="585" y="308" fill="#9BAAB5" font-size="18" font-weight="500">In den Fenstern brennt noch Licht</text>
      <text x="585" y="350" fill="#F1F6F7" font-size="32" font-weight="650" letter-spacing="-.7">Und der Himmel ändert sich</text>
      <text x="585" y="383" fill="#B9C7CD" font-size="19" font-weight="500">♪</text>
      <rect x="585" y="413" width="517" height="3" rx="1.5" fill="#394850"/>
      <rect x="585" y="413" width="286" height="3" rx="1.5" fill="#79F2D4"/>
    </g>
  </g>
</svg>
