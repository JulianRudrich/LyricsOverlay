[package]
name = "media-session"
description = "Finds the music players that are open and reads what they play, on Windows, macOS and Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
lyrics-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Foundation_Collections"] }

